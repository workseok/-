[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videomatte"
version = "0.1.0"
description = "영상에서 대상을 자동 검출/분할하여 알파 매트를 추출하고 새 배경과 합성하는 CLI"
readme = "README.md"
requires-python = ">=3.10"
# PyTorch 와 SAM 2 는 OS/GPU 별 설치 방식이 달라 여기에 넣지 않았습니다.
# docs/SETUP_MAC.md, docs/SETUP_WINDOWS.md 참고.
dependencies = [
  "numpy",
  "opencv-python-headless",
  "pillow",
  "tqdm",
  "pyyaml",
  "pymatting",
  "transformers>=4.45",
  "huggingface_hub",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
videomatte = "videomatte.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "models: 실제 모델 가중치가 models/ 에 있어야 하는 테스트 (없으면 skip)",
]
